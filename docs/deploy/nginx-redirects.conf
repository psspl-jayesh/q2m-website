# Q2M Solutions: redirects for old URLs (301) and the 404 page. Generated by scripts/redirects.mjs; edit the list there.
# nginx: paste inside the server { } block for q2msolutions.in, with root pointing at the uploaded folder.
# HTTPS and the www -> non-www redirect are set in the server blocks themselves (see docs/DEPLOYMENT_FOR_ADMIN.md).

index index.html;
error_page 404 /404.html;

# Old URLs
location ~ ^/case-study/?$ { return 301 /case-studies/; }
location ~ ^/portfolio/?$ { return 301 /case-studies/; }
location ~ ^/author/waseem/?$ { return 301 /blogs/; }
location ~ ^/category/artificial-intelligence/ai-chatbot-development/?$ { return 301 /category/ai-chatbot-development/; }
location ~ ^/category/development/machine-learning-development-service/?$ { return 301 /category/machine-learning-development-service/; }
location ~ ^/agentic-ai-services/?$ { return 301 /ai-agent-development-services/; }
location ~ ^/recommendation-engines/?$ { return 301 /ai-recommendation-systems/; }
location ~ ^/ai4-2026-americas-largest-ai-conference/?$ { return 301 /q2m-solutions-is-heading-to-ai4-2026/; }

# Pages: /about/ -> /about/index.html; anything else that does not exist -> 404 page
location / { try_files $uri $uri/ =404; }

# Caching: hashed build files and optimised images for a year; pages always revalidated
location ~* \.(js|css|woff2|avif|webp|png|jpg|svg)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
location ~* \.html$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
